name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: Keimelion/Keimelion-Infra/.github/workflows/node-ci.yml@v0.5.0

  # Playwright smoke specs against the standalone build, the API is mocked by route interception.
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Use .env.example as build env
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Run smoke specs
        run: npm run test:e2e

  pr-title:
    if: github.event_name == 'pull_request'
    uses: Keimelion/Keimelion-Infra/.github/workflows/pr-title.yml@v0.5.0

  # Patch/minor Dependabot bumps merge themselves once ci, e2e and pr-title are green.
  dependabot-automerge:
    needs: [ci, e2e, pr-title]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/dependabot-automerge.yml@v0.5.0
